<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#0A0A0B" />
    <meta name="author" content="IVE studio" />
    <!-- Шрифт свой: подгружаем его до CSS, иначе заголовок перерисуется на первом экране. -->
    <link
      rel="preload"
      href="/fonts/outfit-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>UX/UI Design &amp; Web Development Studio — IVE</title>
    <meta
      name="description"
      content="We design and build websites that convert: UX/UI, web development, SaaS and MVP. Fixed scope, fixed price, live in weeks."
    />
    <!-- Google Analytics (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-SS4H5LTY22"></script>
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() {
        dataLayer.push(arguments)
      }
      // Consent Mode: до ответа посетителя аналитика работает без cookie
      // и без идентификатора. Это стоит здесь, а не в бандле, — иначе первый
      // хит успел бы уйти с полным набором до всякого согласия.
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        wait_for_update: 500,
      })
      try {
        if (localStorage.getItem('ive-consent') === 'granted')
          gtag('consent', 'update', { analytics_storage: 'granted' })
      } catch (e) {
        /* приватный режим — остаёмся на отказе */
      }
      gtag('js', new Date())
      // Просмотр страницы отправляет main.tsx — после того, как решён язык.
      // Иначе у каждого немецкого визита сначала засчитывалась бы английская «/»,
      // с которой посетитель тут же «ушёл»: лишний просмотр и ложный отказ.
      gtag('config', 'G-SS4H5LTY22', { send_page_view: false })
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
