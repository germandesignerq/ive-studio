# ──────────────────────────────────────────────────────────────────────────
# Конфиг сайта для nginx. Кладётся в /etc/nginx/sites-available/ive-studio
# и линкуется в sites-enabled; сертификаты выпускает certbot.
#
# Здесь важны не только заголовки: без первых трёх блоков один и тот же сайт
# доступен по четырём адресам (http/https × www/без www), и поисковик делит
# между ними вес. Без `=404` в try_files несуществующая страница отдаётся
# с кодом 200 — Google считает такой адрес рабочим и держит его в индексе.
# ──────────────────────────────────────────────────────────────────────────

# 1. http → https, оба хоста разом
server {
    listen 80;
    listen [::]:80;
    server_name ive-studio.com www.ive-studio.com;

    # проверка домена для certbot должна проходить по http
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://ive-studio.com$request_uri;
    }
}

# 2. www → без www (canonical в разметке ведёт именно туда)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.ive-studio.com;

    ssl_certificate     /etc/letsencrypt/live/ive-studio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ive-studio.com/privkey.pem;

    return 301 https://ive-studio.com$request_uri;
}

# 3. сам сайт
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ive-studio.com;

    ssl_certificate     /etc/letsencrypt/live/ive-studio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ive-studio.com/privkey.pem;

    root /opt/ive-studio/frontend/dist;
    index index.html;

    charset utf-8;
    server_tokens off;

    # AVIF и woff2 уже сжаты — их gzip только греет процессор
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml application/rss+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 4. один адрес вместо двух: /pricing/ → /pricing.
    #    Условие «хотя бы один символ до слэша» обязательно — иначе «/»
    #    редиректил бы сам на себя до бесконечности.
    rewrite ^(/.+)/$ $1 permanent;

    # 5. заявки с форм
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 6. файлы с хешем в имени и шрифты не меняются никогда
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # картинки живут дольше страниц, но не вечно: имя без хеша
    location /img/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # 7. страницы: короткий кэш, иначе после деплоя посетители какое-то время
    #    видят старую версию
    location = /sitemap.xml {
        expires 1h;
    }

    # .xml по умолчанию отдаётся как text/xml; читалкам нужен свой тип
    location ~* /rss\.xml$ {
        expires 1h;
        types { }
        default_type "application/rss+xml; charset=utf-8";
    }

    location / {
        add_header Cache-Control "public, max-age=300";
        # =404 — ключевая часть: без него нехватка файла молча превращалась бы
        # в 200 и мягкую 404, которую Google считает нормальной страницей
        try_files $uri $uri/index.html =404;
    }

    # 8. и только теперь — красивая страница ошибки, но с честным кодом 404
    error_page 404 /404.html;

    location = /404.html {
        internal;
    }
}
